<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#23634b"><title>わが家の買い物メモ</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#22362e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:24px 16px 90px}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:#39775e}.subtitle{color:#64776d;margin:7px 0}.basket{font-size:42px}.status{padding:12px;border-radius:12px;background:#fff0d9;color:#754b1e;margin:12px 0 18px;font-size:13px}.card,.section{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 12px #132e2110;margin-bottom:18px}.add{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.add #name{flex:1 1 180px}.add .quantity-input{width:78px;flex:0 0 78px;padding:14px 8px;border:1px solid #ccd8cd;border-radius:12px;font-size:16px;text-align:center}.quantity-input:focus-visible{outline:3px solid #82b59d;outline-offset:2px}input[type=text]{font:inherit;min-width:0;flex:1;padding:14px;border:1px solid #ccd8cd;border-radius:12px;font-size:16px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #82b59d;outline-offset:2px}.primary{background:#23634b;color:white;font-weight:700}.feedback{color:#9b3838;min-height:20px;margin:8px 0 0;font-size:14px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.count{border-radius:100px;background:#e8f3ea;color:#23634b;padding:3px 9px}.muted{background:#eee;color:#777}.hint{font-size:12px;color:#819086}ul{padding:0;margin:0;list-style:none}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #eef2ef;min-height:59px}.item label{display:flex;align-items:center;flex:1;gap:13px;min-height:58px;cursor:pointer;font-size:17px}.item input{width:22px;height:22px;accent-color:#23634b}.item.done label{text-decoration:line-through;color:#829087}.remove{background:none;color:#9a7676;font-size:25px}.qty-controls{display:flex;align-items:center;gap:3px;flex-shrink:0}.qty-controls button{padding:5px 8px;min-width:36px;min-height:40px;background:#edf5ef;color:#23634b;font-weight:700}.qty-controls button:disabled{opacity:.35;cursor:default}.qty-value{min-width:30px;text-align:center;font-weight:700;font-size:15px}.item label{min-width:0}.item label span{overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:9px}.chips button{background:#edf5ef;color:#23634b}.chips button.in-list{background:#d7e8db}.quick-entry{display:inline-flex;align-items:center;gap:2px;background:#edf5ef;border-radius:12px}.quick-entry button{background:transparent}.quick-entry .quick-remove{padding:3px 8px;min-width:38px;color:#9a4747;border-radius:10px}.quick-form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.quick-form input{flex:1 1 180px}.quick-form button{background:#23634b;color:#fff;font-weight:700}.empty{color:#829087;font-size:14px}.link{background:none;color:#a44040;padding:5px}.foot{text-align:center;color:#819086;font-size:12px}
</style></head>
<body><main class="app"><header><div><div class="eyebrow">FAMILY SHOPPING</div><h1>わが家の買い物メモ</h1><p class="subtitle">買い忘れも、二重買いも防ごう</p></div><div class="basket">🛒</div></header>
<p class="status" role="status">● お試し版：この端末だけに保存。夫婦共有はまだ設定されていません。</p>
<section class="card"><form class="add" id="addForm"><input id="name" maxlength="60" placeholder="何を買う？ 例：牛乳" aria-label="商品名" required><input class="quantity-input" id="quantity" type="number" min="1" max="999" step="1" value="1" inputmode="numeric" aria-label="個数"><button class="primary">＋ 追加</button></form><p id="feedback" class="feedback" role="status"></p></section>
<section class="section"><div class="heading"><h2>買うもの <span class="count" id="todoCount">0</span></h2><span class="hint">買ったらチェック ✓</span></div><ul id="todo"></ul><p id="todoEmpty" class="empty">買うものはありません 🎉</p></section>
<section class="section"><h2>よく買うもの</h2><p class="hint">タップで追加。✓ はリストにあるものです。</p><div class="chips" id="quick"></div><form class="quick-form" id="quickForm"><input type="text" id="quickName" maxlength="60" placeholder="よく買うものを登録" aria-label="よく買うものの名前" required><button type="submit">＋ 登録</button></form><p class="hint" id="quickFeedback" role="status"></p></section>
<section class="section"><div class="heading"><h2>購入済み <span class="count muted" id="doneCount">0</span></h2><button class="link" id="clear" type="button">購入済みを整理</button></div><ul id="done"></ul><p class="empty" id="doneEmpty">まだ購入済みのものはありません</p></section>
<p class="foot">買い物リストだけのシンプルなアプリ</p></main>
<script>
(()=>{'use strict';
const KEY='family-shopping-v1-local',QUICK_KEY='family-shopping-quick-v1',DEFAULT_QUICK=['牛乳','卵','納豆','豆腐','食パン','バナナ','鶏肉','玉ねぎ'];let quick=[...DEFAULT_QUICK];try{const saved=JSON.parse(localStorage.getItem(QUICK_KEY)||'null');if(Array.isArray(saved))quick=saved.filter(x=>typeof x==='string'&&x.length>0&&x.length<=60)}catch{}
const el=id=>document.getElementById(id),clean=s=>s.normalize('NFKC').trim().replace(/\s+/g,' '),norm=s=>clean(s).toLocaleLowerCase('ja-JP');
let items=[];try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))items=v.filter(x=>x&&typeof x.name==='string'&&typeof x.id==='string').map(x=>({...x,quantity:Number.isInteger(x.quantity)&&x.quantity>=1&&x.quantity<=999?x.quantity:1}))}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));el('feedback').textContent='';return true}catch{el('feedback').textContent='保存できませんでした。ストレージ設定を確認してください。';return false}}
function saveQuick(){try{localStorage.setItem(QUICK_KEY,JSON.stringify(quick));el('quickFeedback').textContent='';return true}catch{el('quickFeedback').textContent='登録内容を保存できませんでした';return false}}function renderRow(item){let li=document.createElement('li');li.className='item'+(item.done?' done':'');let label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=!!item.done;cb.setAttribute('aria-label',item.name+'を'+(item.done?'未購入に戻す':'購入済みにする'));cb.addEventListener('change',()=>{let old=item.done,oldDate=item.doneAt;item.done=cb.checked;item.doneAt=item.done?Date.now():null;if(!save()){item.done=old;item.doneAt=oldDate}draw()});let span=document.createElement('span');span.textContent=item.name;label.append(cb,span);let remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',item.name+'を削除');remove.addEventListener('click',()=>{let old=items;items=items.filter(x=>x.id!==item.id);if(!save())items=old;draw()});let qty=document.createElement('div');qty.className='qty-controls';let minus=document.createElement('button'),plus=document.createElement('button'),amount=document.createElement('span');amount.className='qty-value';amount.textContent=item.quantity||1;minus.type=plus.type='button';minus.textContent='−';plus.textContent='＋';minus.disabled=(item.quantity||1)<=1;plus.disabled=(item.quantity||1)>=999;minus.setAttribute('aria-label',item.name+'の個数を減らす');plus.setAttribute('aria-label',item.name+'の個数を増やす');const changeQty=delta=>{const prev=item.quantity||1;const next=prev+delta;if(next<1||next>999)return;item.quantity=next;if(!save())item.quantity=prev;draw()};minus.addEventListener('click',()=>changeQty(-1));plus.addEventListener('click',()=>changeQty(1));qty.append(minus,amount,plus);li.append(label,qty,remove);return li}
function draw(){let todo=items.filter(x=>!x.done).sort((a,b)=>b.createdAt-a.createdAt),done=items.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));el('todo').replaceChildren(...todo.map(renderRow));el('done').replaceChildren(...done.map(renderRow));el('todoCount').textContent=todo.length;el('doneCount').textContent=done.length;el('todoEmpty').hidden=todo.length>0;el('doneEmpty').hidden=done.length>0;el('clear').disabled=!done.length;el('quick').replaceChildren(...quick.map(name=>{let wrap=document.createElement('span');wrap.className='quick-entry';let b=document.createElement('button');let listed=todo.some(x=>norm(x.name)===norm(name));b.type='button';b.className=listed?'in-list':'';b.textContent=(listed?'✓ ':'＋ ')+name;b.addEventListener('click',()=>add(name));let del=document.createElement('button');del.type='button';del.className='quick-remove';del.textContent='×';del.setAttribute('aria-label',name+'をよく買うものから削除');del.addEventListener('click',()=>{let old=quick;quick=quick.filter(x=>norm(x)!==norm(name));if(!saveQuick())quick=old;draw()});wrap.append(b,del);return wrap}))}
function add(input,quantity=1){let name=clean(input);if(!name)return;quantity=Number(quantity);if(!Number.isInteger(quantity)||quantity<1||quantity>999){el('feedback').textContent='個数は1〜999の整数にしてください';return}if(name.length>60){el('feedback').textContent='商品名は60文字以内にしてください';return}let match=items.find(x=>norm(x.name)===norm(name));if(match&&!match.done){el('feedback').textContent='「'+name+'」はすでにリストにあります';return}let old=JSON.stringify(items);if(match){match.name=name;match.done=false;match.doneAt=null;match.createdAt=Date.now();match.quantity=quantity}else{let id=Array.from(new TextEncoder().encode(norm(name)),b=>b.toString(16).padStart(2,'0')).join('');items.push({id,name,quantity,done:false,createdAt:Date.now(),doneAt:null})}if(!save())items=JSON.parse(old);else{el('name').value='';el('quantity').value='1'}draw()}
el('quickForm').addEventListener('submit',e=>{e.preventDefault();let name=clean(el('quickName').value);if(!name||name.length>60){el('quickFeedback').textContent='商品名は1〜60文字で入力してください';return}if(quick.some(x=>norm(x)===norm(name))){el('quickFeedback').textContent='すでに登録されています';return}let old=quick;quick=[...quick,name];if(!saveQuick())quick=old;else el('quickName').value='';draw()});el('addForm').addEventListener('submit',e=>{e.preventDefault();add(el('name').value,el('quantity').value)});
el('clear').addEventListener('click',()=>{if(!window.confirm('購入済みの商品をすべて削除しますか？'))return;let old=items;items=items.filter(x=>!x.done);if(!save())items=old;draw()});draw();
})();
</script></body></html>
