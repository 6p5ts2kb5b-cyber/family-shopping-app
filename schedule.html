<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23634b"><title>家族の予定</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#244638;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:20px 16px 75px}h1{font-size:25px}.panel{background:white;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 3px 10px #0001}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;border-radius:10px;min-height:43px}input,select{border:1px solid #c6d2c9;padding:8px;min-width:0}input[type=text]{width:100%}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{display:grid;gap:4px;font-size:13px}.fields .wide{grid-column:1/-1}button{border:0;padding:9px 14px;cursor:pointer}.primary{background:#23634b;color:white}.secondary{background:#eaf3ec;color:#23634b}.danger{background:#fff0ef;color:#a33}.note{font-size:13px;color:#60756b}.event{border-top:1px solid #e4ece6;padding:12px 0}.event-title{font-weight:750}.times{display:flex;flex-wrap:wrap;gap:10px;margin:7px 0;color:#536b5d;font-size:14px}.chip{background:#e8f1e9;border-radius:8px;padding:3px 8px}.hidden{display:none}.alert{padding:12px;border-radius:10px;background:#fff1d9;color:#714e20}a{color:#23634b}</style></head>
<body><main class="wrap"><a href="./shared.html">← 買い物リストに戻る</a><h1>📅 家族の予定</h1><p class="note">家族全員・妻・夫の予定を夫婦で共有</p>
<section class="panel"><div class="row"><button id="login" class="primary">Googleでログイン</button><button id="logout" class="secondary hidden">ログアウト</button></div><p id="account" class="note"></p><p id="status" class="alert" role="status">ログインしてください。</p></section>
<div id="main" class="hidden">
<section class="panel"><div class="row"><button id="prev" class="secondary">前の日</button><input id="selectedDay" type="date" aria-label="表示する日付"><button id="next" class="secondary">次の日</button><button id="today" class="secondary">今日</button></div><h2>この日の予定</h2><div id="events"></div></section>
<section class="panel"><h2 id="formTitle">予定を追加</h2><form id="form" class="fields"><label>日付<input type="date" id="date" required></label><label>誰の予定？<select id="who"><option value="family">家族全員</option><option value="wife">妻</option><option value="husband">夫</option></select></label><label class="wide">予定内容<input type="text" id="name" maxlength="80" placeholder="例：買い物、野球、学校行事" required></label><label>家を出る時間<input type="time" id="departure"></label><label>帰宅予定時間<input type="time" id="returnTime"></label><div class="wide row"><button class="primary" type="submit" id="save">予定を保存</button><button class="secondary hidden" type="button" id="cancel">編集をやめる</button></div></form><p class="note">時間が未定なら空欄でOK。変更・削除もできます。</p></section></div>
<p class="note">既存の買い物データには触れません。予定の共有にはFirestoreルールの追加設定が必要です。</p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js?v=20261011-fix2";
const $=id=>document.getElementById(id),app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let events=[],unsubscribe=null,editing=null,enabled=false;
// 旧データの who:'me'（私）は夫として扱う。データ自体は書き換えない（編集して保存したときだけ husband になる）
const normWho=w=>w==='me'?'husband':(w==='wife'||w==='family'||w==='husband'?w:'family');
const WHO_LABEL={family:'👨‍👩‍👧 家族全員',wife:'👩 妻',husband:'👨 夫'};
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const shift=(s,n)=>{let [y,m,d]=s.split('-').map(Number);return localDate(new Date(y,m-1,d+n))};
const requestedDate=new URLSearchParams(location.search).get('date');const initialDate=requestedDate&&/^\d{4}-\d{2}-\d{2}$/.test(requestedDate)&&!Number.isNaN(new Date(requestedDate+'T12:00:00').getTime())?requestedDate:localDate(new Date());$('selectedDay').value=initialDate;$('date').value=initialDate;
const err=e=>e?.code==='permission-denied'?'予定のアクセス権限がありません。Firestoreのルールに familySchedules の許可を追加してください。':e?.code==='unavailable'?'通信ができません。電波を確認してください。':e?.code==='auth/popup-blocked'?'ポップアップがブロックされました。Safariで開いてください。':'エラー：'+(e?.code||'設定を確認してください');
function status(s){$('status').textContent=s}
function resetEdit(){editing=null;$('form').reset();$('date').value=$('selectedDay').value;$('formTitle').textContent='予定を追加';$('cancel').classList.add('hidden')}
function show(){let date=$('selectedDay').value;let filtered=events.filter(e=>e.date===date).sort((a,b)=>(a.departure||'99:99').localeCompare(b.departure||'99:99'));let out=[];for(const e of filtered){let div=document.createElement('div');div.className='event';let name=document.createElement('div');name.className='event-title';name.textContent=(WHO_LABEL[normWho(e.who)]||'家族')+'｜'+e.name;let times=document.createElement('div');times.className='times';for(const s of ['出発 '+(e.departure||'未定'),'帰宅予定 '+(e.returnTime||'未定')]){let span=document.createElement('span');span.className='chip';span.textContent=s;times.append(span)}let actions=document.createElement('div');actions.className='row';let edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{editing=e.id;$('date').value=e.date;$('name').value=e.name;$('who').value=normWho(e.who);$('departure').value=e.departure||'';$('returnTime').value=e.returnTime||'';$('formTitle').textContent='予定を編集';$('cancel').classList.remove('hidden')};let del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=async()=>{if(!confirm('この予定を削除しますか？'))return;try{await deleteDoc(doc(db,'familySchedules',e.id))}catch(x){status(err(x))}};actions.append(edit,del);div.append(name,times,actions);out.push(div)}$('events').replaceChildren(...out);if(!out.length)$('events').textContent='この日の予定はまだありません。'}
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status(err(e))}};
$('logout').onclick=()=>signOut(auth).catch(e=>status(err(e)));
onAuthStateChanged(auth,u=>{if(unsubscribe){unsubscribe();unsubscribe=null}enabled=false;events=[];$('main').classList.add('hidden');$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('account').textContent=u?u.email||'ログイン済み':'';if(!u){status('Googleでログインしてください。');return}status('予定を読み込み中…');unsubscribe=onSnapshot(collection(db,'familySchedules'),snap=>{events=snap.docs.map(x=>({id:x.id,...x.data()}));enabled=true;$('main').classList.remove('hidden');status('夫婦共有の予定を表示中');show()},e=>{enabled=false;$('main').classList.add('hidden');status(err(e))})});
$('selectedDay').onchange=()=>{resetEdit();show()};$('today').onclick=()=>{$('selectedDay').value=localDate(new Date());resetEdit();show()};$('prev').onclick=()=>{$('selectedDay').value=shift($('selectedDay').value,-1);resetEdit();show()};$('next').onclick=()=>{$('selectedDay').value=shift($('selectedDay').value,1);resetEdit();show()};$('cancel').onclick=resetEdit;
$('form').onsubmit=async e=>{e.preventDefault();if(!enabled)return;let record={date:$('date').value,name:$('name').value.trim(),who:$('who').value,departure:$('departure').value,returnTime:$('returnTime').value};if(!/^\d{4}-\d{2}-\d{2}$/.test(record.date)||!record.name||record.name.length>80)return;try{let id=editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+'-'+Math.random().toString(36).slice(2));await setDoc(doc(db,'familySchedules',id),record);$('selectedDay').value=record.date;resetEdit();show();status('予定を保存しました')}catch(x){status(err(x))}};
</script></body></html>
