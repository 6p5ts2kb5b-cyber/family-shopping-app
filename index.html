<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#23634b"><title>わが家の買い物メモ</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#22362e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:24px 16px 90px}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:#39775e}.subtitle{color:#64776d;margin:7px 0}.basket{font-size:42px}.status{padding:12px;border-radius:12px;background:#fff0d9;color:#754b1e;margin:12px 0 18px;font-size:13px}.card,.section{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 12px #132e2110;margin-bottom:18px}.add{display:flex;gap:9px}input[type=text]{font:inherit;min-width:0;flex:1;padding:14px;border:1px solid #ccd8cd;border-radius:12px;font-size:16px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #82b59d;outline-offset:2px}.primary{background:#23634b;color:white;font-weight:700}.feedback{color:#9b3838;min-height:20px;margin:8px 0 0;font-size:14px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.count{border-radius:100px;background:#e8f3ea;color:#23634b;padding:3px 9px}.muted{background:#eee;color:#777}.hint{font-size:12px;color:#819086}ul{padding:0;margin:0;list-style:none}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #eef2ef;min-height:59px}.item label{display:flex;align-items:center;flex:1;gap:13px;min-height:58px;cursor:pointer;font-size:17px}.item input{width:22px;height:22px;accent-color:#23634b}.item.done label{text-decoration:line-through;color:#829087}.remove{background:none;color:#9a7676;font-size:25px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chips button{background:#edf5ef;color:#23634b}.chips button.in-list{background:#d7e8db}.empty{color:#829087;font-size:14px}.link{background:none;color:#a44040;padding:5px}.foot{text-align:center;color:#819086;font-size:12px}
</style></head>
<body><main class="app"><header><div><div class="eyebrow">FAMILY SHOPPING</div><h1>わが家の買い物メモ</h1><p class="subtitle">買い忘れも、二重買いも防ごう</p></div><div class="basket">🛒</div></header>
<p class="status" role="status">● お試し版：この端末だけに保存。夫婦共有はまだ設定されていません。</p>
<section class="card"><form class="add" id="addForm"><input id="name" maxlength="60" placeholder="何を買う？ 例：牛乳" aria-label="商品名" required><button class="primary">＋ 追加</button></form><p id="feedback" class="feedback" role="status"></p></section>
<section class="section"><div class="heading"><h2>買うもの <span class="count" id="todoCount">0</span></h2><span class="hint">買ったらチェック ✓</span></div><ul id="todo"></ul><p id="todoEmpty" class="empty">買うものはありません 🎉</p></section>
<section class="section"><h2>よく買うもの</h2><p class="hint">タップで追加。✓ はリストにあるものです。</p><div class="chips" id="quick"></div></section>
<section class="section"><div class="heading"><h2>購入済み <span class="count muted" id="doneCount">0</span></h2><button class="link" id="clear" type="button">購入済みを整理</button></div><ul id="done"></ul><p class="empty" id="doneEmpty">まだ購入済みのものはありません</p></section>
<p class="foot">買い物リストだけのシンプルなアプリ</p></main>
<script>
(()=>{'use strict';
const KEY='family-shopping-v1-local',QUICK=['牛乳','卵','納豆','豆腐','食パン','バナナ','鶏肉','玉ねぎ'];
const el=id=>document.getElementById(id),clean=s=>s.normalize('NFKC').trim().replace(/\s+/g,' '),norm=s=>clean(s).toLocaleLowerCase('ja-JP');
let items=[];try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))items=v.filter(x=>x&&typeof x.name==='string'&&typeof x.id==='string')}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));el('feedback').textContent='';return true}catch{el('feedback').textContent='保存できませんでした。ストレージ設定を確認してください。';return false}}
function renderRow(item){let li=document.createElement('li');li.className='item'+(item.done?' done':'');let label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=!!item.done;cb.setAttribute('aria-label',item.name+'を'+(item.done?'未購入に戻す':'購入済みにする'));cb.addEventListener('change',()=>{let old=item.done,oldDate=item.doneAt;item.done=cb.checked;item.doneAt=item.done?Date.now():null;if(!save()){item.done=old;item.doneAt=oldDate}draw()});let span=document.createElement('span');span.textContent=item.name;label.append(cb,span);let remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',item.name+'を削除');remove.addEventListener('click',()=>{let old=items;items=items.filter(x=>x.id!==item.id);if(!save())items=old;draw()});li.append(label,remove);return li}
function draw(){let todo=items.filter(x=>!x.done).sort((a,b)=>b.createdAt-a.createdAt),done=items.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));el('todo').replaceChildren(...todo.map(renderRow));el('done').replaceChildren(...done.map(renderRow));el('todoCount').textContent=todo.length;el('doneCount').textContent=done.length;el('todoEmpty').hidden=todo.length>0;el('doneEmpty').hidden=done.length>0;el('clear').disabled=!done.length;el('quick').replaceChildren(...QUICK.map(name=>{let b=document.createElement('button');let listed=todo.some(x=>norm(x.name)===norm(name));b.type='button';b.className=listed?'in-list':'';b.textContent=(listed?'✓ ':'＋ ')+name;b.addEventListener('click',()=>add(name));return b}))}
function add(input){let name=clean(input);if(!name)return;if(name.length>60){el('feedback').textContent='商品名は60文字以内にしてください';return}let match=items.find(x=>norm(x.name)===norm(name));if(match&&!match.done){el('feedback').textContent='「'+name+'」はすでにリストにあります';return}let old=JSON.stringify(items);if(match){match.name=name;match.done=false;match.doneAt=null;match.createdAt=Date.now()}else{let id=Array.from(new TextEncoder().encode(norm(name)),b=>b.toString(16).padStart(2,'0')).join('');items.push({id,name,done:false,createdAt:Date.now(),doneAt:null})}if(!save())items=JSON.parse(old);else el('name').value='';draw()}
el('addForm').addEventListener('submit',e=>{e.preventDefault();add(el('name').value)});
el('clear').addEventListener('click',()=>{if(!window.confirm('購入済みの商品をすべて削除しますか？'))return;let old=items;items=items.filter(x=>!x.done);if(!save())items=old;draw()});draw();
})();
</script></body></html>
