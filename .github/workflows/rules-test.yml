name: Firestore rules test
on:
  push:
    paths: ['app.html', 'app.webmanifest', 'icons/**', 'lib/**', 'setup.html', 'firestore.rules', 'tests/**', 'package.json', 'firebase.json', '.github/workflows/rules-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Schedule logic tests
        run: node --test tests/quick-schedule.test.mjs tests/schedule-views.test.mjs tests/share.test.mjs tests/kid-notices.test.mjs tests/kid-board.test.mjs
      - run: npm install --no-audit --no-fund
      - name: Run rules tests
        run: |
          set +e
          npm run test:rules > out.txt 2>&1
          code=$?
          cat out.txt
          # 結果を注釈（annotation）としても出す（ログを開けない環境から確認するため）
          summary=$(grep -E '^# (tests|pass|fail)' out.txt | tr '\n' ' ')
          echo "::notice title=rules test summary::exit=$code $summary"
          grep -E '^not ok' out.txt | head -10 | while read -r line; do echo "::error title=failed test::$line"; done
          tail -40 out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::notice title=output tail::/'
          exit $code
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: App screen tests (fake Firebase)
        run: |
          python3 -m http.server 8790 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e/app.e2e.mjs > e2e.txt 2>&1; c1=$?
          node tests/e2e/stage3.e2e.mjs >> e2e.txt 2>&1; c2=$?
          node tests/e2e/stage4.e2e.mjs >> e2e.txt 2>&1; c3=$?
          node tests/e2e/ui.e2e.mjs >> e2e.txt 2>&1; c4=$?
          node tests/e2e/share.e2e.mjs >> e2e.txt 2>&1; c5=$?
          node tests/e2e/kids.e2e.mjs >> e2e.txt 2>&1; c6=$?
          code=$(( c1 || c2 || c3 || c4 || c5 || c6 ))
          cat e2e.txt
          echo "::notice title=e2e summary::exit=$code pass=$(grep -c '^PASS' e2e.txt) fail=$(grep -c '^FAIL' e2e.txt)"
          grep '^FAIL' e2e.txt | head -10 | while read -r l; do echo "::error title=e2e failed::$l"; done
          exit $code
